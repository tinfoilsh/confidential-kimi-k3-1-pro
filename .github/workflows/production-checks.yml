name: Production package checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - name: Verify the release configuration
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/python -m unittest discover -s tests -v
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Provision storage for the CUDA base image
        shell: bash
        run: |
          readonly UNUSED_SDK_PATHS=(/usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache)
          sudo rm -rf -- "${UNUSED_SDK_PATHS[@]}"
          docker image prune --all --force
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Build the image and run compatibility checks
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64
          push: false
